name: Build & Release Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Cho phép bấm nút "Run workflow" thủ công trên web GitHub bất cứ lúc nào

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java JDK (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 🚀 Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Install Flutter Dependencies
        working-directory: mobile
        run: flutter pub get --verbose

      - name: ⚙️ Generate Code (Isar Database & JSON Schemas)
        working-directory: mobile
        run: dart run build_runner build --delete-conflicting-outputs

      - name: 🔨 Build Release APK
        working-directory: mobile
        run: flutter build apk --release --verbose

      - name: 📤 Upload Release APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MP3Downloader-Release-APK
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
