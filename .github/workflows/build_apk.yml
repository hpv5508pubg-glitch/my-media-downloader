name: Build & Release Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java JDK (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 🚀 Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 🛠️ Restore Official Android Gradle Environment
        working-directory: mobile
        run: |
          # 1. Create clean official android template in temp directory
          flutter create /tmp/temp_android --platforms=android --org=com.example.app

          # 2. Copy official Gradle wrapper, settings.gradle, and root build.gradle
          cp /tmp/temp_android/android/gradlew android/gradlew
          chmod +x android/gradlew
          cp /tmp/temp_android/android/gradlew.bat android/gradlew.bat
          mkdir -p android/gradle/wrapper
          cp /tmp/temp_android/android/gradle/wrapper/gradle-wrapper.jar android/gradle/wrapper/gradle-wrapper.jar
          cp /tmp/temp_android/android/gradle/wrapper/gradle-wrapper.properties android/gradle/wrapper/gradle-wrapper.properties

          cp /tmp/temp_android/android/settings.gradle android/settings.gradle
          cp /tmp/temp_android/android/build.gradle android/build.gradle

          # 3. Use official app/build.gradle as baseline
          cp /tmp/temp_android/android/app/build.gradle android/app/build.gradle

          # Append desugaring, multiDex and minSdk 24
          cat << 'EOF' >> android/app/build.gradle

android {
    defaultConfig {
        minSdkVersion 24
        multiDexEnabled true
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
}
EOF

          rm -rf /tmp/temp_android

      - name: 📦 Install Flutter Dependencies
        working-directory: mobile
        run: flutter pub get --verbose

      - name: ⚙️ Generate Code (Isar Database & JSON Schemas)
        working-directory: mobile
        run: dart run build_runner build --delete-conflicting-outputs

      - name: 🔨 Build Release APK
        working-directory: mobile
        run: |
          set -o pipefail
          flutter build apk --release --verbose 2>&1 | tee build.log || {
            echo "=== UPLOADING ERROR LOG TO 0X0.ST ==="
            curl -s -F'file=@build.log' https://0x0.st || true
            exit 1
          }

      - name: 📄 Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Flutter-Build-Log
          path: mobile/build.log
          retention-days: 7

      - name: 📤 Upload Release APK to Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MP3Downloader-Release-APK
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
