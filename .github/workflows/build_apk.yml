name: Build & Release Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java JDK (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 🚀 Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 🛠️ Restore Android Gradle Wrapper
        working-directory: mobile
        run: |
          flutter create /tmp/temp_android --platforms=android --org=com.example.app
          cp /tmp/temp_android/android/gradlew android/gradlew
          chmod +x android/gradlew
          cp /tmp/temp_android/android/gradlew.bat android/gradlew.bat
          mkdir -p android/gradle/wrapper
          cp /tmp/temp_android/android/gradle/wrapper/gradle-wrapper.jar android/gradle/wrapper/gradle-wrapper.jar
          cp /tmp/temp_android/android/gradle/wrapper/gradle-wrapper.properties android/gradle/wrapper/gradle-wrapper.properties
          rm -rf /tmp/temp_android

      - name: 📦 Install Flutter Dependencies
        working-directory: mobile
        run: flutter pub get --verbose

      - name: ⚙️ Generate Code (Isar Database & JSON Schemas)
        working-directory: mobile
        run: dart run build_runner build --delete-conflicting-outputs

      - name: 🔨 Build Release APK
        working-directory: mobile
        run: |
          set -o pipefail
          flutter build apk --release --verbose 2>&1 | tee build.log || {
            echo "### ❌ Build Failure Log (Last 100 lines)" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 100 build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: 📄 Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Flutter-Build-Log
          path: mobile/build.log
          retention-days: 7

      - name: 📤 Upload Release APK to Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MP3Downloader-Release-APK
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
