name: mobile
description: "Private Multi-Platform Media Downloader & Offline Music Player"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Local Database (AGP 8+ Compatible Isar Community Fork)
  isar_community: ^3.4.1
  isar_community_flutter_libs: ^3.4.1
  path_provider: ^2.1.2

  # Networking & HTTP
  dio: ^5.4.3+1

  # Storage & Android Scoped Storage (/Music MediaStore)
  media_store_plus: ^0.1.3

  # ID3 Metadata & Album Art Editing
  audiotags: ^1.4.0

  # Audio Engine & Background Playback
  just_audio: ^0.9.36
  audio_service: ^0.18.12

  # Equalizer & Audio FX
  equalizer_flutter: ^0.0.8

  # Screen & CPU Keep-Alive during background downloads
  wakelock_plus: ^1.2.0

  # Image Caching & Memory Optimization
  cached_network_image: ^3.3.1

  # Foreground Download Progress Notifications
  flutter_local_notifications: ^17.1.2

  # JSON Serialization
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: any
  isar_community_generator: ^3.4.1
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
